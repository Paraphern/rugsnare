name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (zero deps, no install step by design)
        working-directory: product
        run: npm test

  # The Go port (native/) has tests too - PR #15 arrived with 83 lines of
  # them and CI ran nothing. Never again: vet + test on every push/PR.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
      - name: go vet + test (native launcher)
        working-directory: native
        run: |
          go vet ./...
          go test -race ./...

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RugSnare pins its own corpus (benign baseline must be clean)
        working-directory: corpus/01-rugpull-flights
        run: |
          node ../../product/src/cli.js scan --config ci-mcp.json
          node ../../product/src/cli.js diff --config ci-mcp.json

  field-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce the README field-test claim (real drift between official releases)
        run: bash repro/field-drift.sh
